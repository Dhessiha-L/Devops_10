services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: realestate
      MYSQL_USER: realestate
      MYSQL_PASSWORD: realestate123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_USER: realestate
      DB_PASSWORD: realestate123
      DB_NAME: realestate
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
volumes:
  mysql_data:
